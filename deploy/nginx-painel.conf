# Publica o painel na internet com HTTPS.
#
# O robo escuta so em 127.0.0.1:8080 de proposito: sem isso, o painel ficaria
# acessivel pelo IP do servidor sem certificado, e a senha viajaria em texto
# puro. Quem fala com a internet e o nginx.
#
# Instalacao:
#   sudo cp deploy/nginx-painel.conf /etc/nginx/sites-available/painel
#   sudo ln -s /etc/nginx/sites-available/painel /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d painel.SEU-DOMINIO.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois do certbot, ligue o cookie seguro no .env e reinicie o robo:
#   WEB_SECURE_COOKIE=true
#   sudo systemctl restart blitz-double-bot

server {
    listen 80;
    server_name painel.SEU-DOMINIO.com;

    # O certbot reescreve este bloco para redirecionar ao HTTPS.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Uma tentativa de senha por segundo por IP, com folga para rajada.
    # O robo ja atrasa quem erra, isto e o cinto de seguranca de fora.
    location /api/login {
        limit_req zone=painel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Esta linha precisa ficar no bloco http{} do /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=painel_login:10m rate=1r/s;
